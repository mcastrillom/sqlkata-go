name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.22.x", "1.24.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Vet
        run: go vet ./...

      - name: Test (workspace)
        run: go test -race ./...

      - name: Test root module only
        run: go test ./sqlkata/... ./compiler/... ./tests/...
        env:
          GOWORK: "off"

      - name: Test execution module
        working-directory: execution
        run: go test ./...
        env:
          GOWORK: "off"
